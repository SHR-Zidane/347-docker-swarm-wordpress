# ==============================================================================
# Configuration du serveur web Nginx - Reverse Proxy & FastCGI
# Projet : 347-docker-swarm-wordpress
# Domaine cible : http://www.my-wordpress.ch
# ==============================================================================

server {
    # Port d'écoute standard pour les requêtes HTTP
    listen 80;
    listen [::]:80;

    # Noms d'hôtes acceptés par ce bloc serveur
    # Permet l'accès via le nom de domaine demandé ainsi qu'en local
    server_name www.my-wordpress.ch my-wordpress.ch localhost;

    # Racine du serveur web correspondant au volume partagé WordPress
    root /var/www/html;

    # Fichier d'index par défaut recherché dans l'ordre spécifié
    index index.php index.html index.htm;

    # En-têtes de sécurité HTTP élémentaires
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Interdiction stricte d'accès aux fichiers cachés (ex: .htaccess, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Gestion des requêtes générales : recherche du fichier, du dossier,
    # ou transmission de la requête à index.php pour le routeur WordPress
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Traitement des scripts PHP via le protocole FastCGI
    # Redirection vers le pool de conteneurs WordPress FPM sur le port 9000
    location ~ \.php$ {
        # Séparation du chemin d'accès au script et des arguments supplémentaires
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Vérification préalable que le fichier PHP ciblé existe bien
        try_files $fastcgi_script_name =404;

        # Adresse de résolution DNS interne Docker Swarm vers le service 'wordpress'
        # Le port 9000 est le port d'écoute standard de php-fpm
        fastcgi_pass wordpress:9000;

        # Fichier d'index exécuté par FastCGI
        fastcgi_index index.php;

        # Inclusion des variables de protocole FastCGI par défaut
        include fastcgi_params;

        # Définition des paramètres FastCGI indispensables pour l'exécution PHP
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Paramètres de temporisation pour les requêtes longues (ex: imports)
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Optimisation de la mise en cache navigateur pour les fichiers statiques (médias, styles, scripts)
    location ~* \.(jpg|jpeg|gif|png|webp|svg|woff|woff2|ttf|eot|css|js|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # Gestion spécifique des uploads volumineux pour WordPress
    client_max_body_size 64M;
}
